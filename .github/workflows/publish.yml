name: Publish

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Publish version (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Tag release
        id: tag
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${BRANCH#release/}"
          git tag -m "v${VERSION}" "v${VERSION}"
          git push origin "v${VERSION}"
          git push origin --delete "$BRANCH" || true
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  publish:
    if: >-
      always() && !cancelled() && !failure() &&
      (github.event_name != 'pull_request' || needs.tag.outputs.version != '')
    needs: [tag]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.version }}"
            echo "value=${INPUT#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ needs.tag.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: v${{ steps.version.outputs.value }}

      - name: Extract release notes
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          awk "/^## ${VERSION}/{found=1; next} /^## /{found=0} found" CHANGELOG.md > "${{ runner.temp }}/release-notes.md"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
