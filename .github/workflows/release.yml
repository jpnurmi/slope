name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.2.3)"
        required: true
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Parse version
        id: version
        run: echo "value=${INPUT#v}" >> "$GITHUB_OUTPUT"
        env:
          INPUT: ${{ github.event.inputs.version }}

      - uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --tag v${{ steps.version.outputs.value }} --unreleased --prepend CHANGELOG.md

      - name: Create release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          BODY: ${{ steps.changelog.outputs.content }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="release/${VERSION}"
          if git ls-remote --tags origin | grep -q "refs/tags/v${VERSION}$"; then
            echo "::error::v${VERSION} has already been released"
            exit 1
          fi
          git checkout -B "$BRANCH"
          git add CHANGELOG.md
          git commit -m "release: v${VERSION}"
          git push --force origin "$BRANCH"
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --body "$BODY"
          else
            gh pr create \
              --title "release: v${VERSION}" \
              --body "$BODY" \
              --base main \
              --head "$BRANCH"
          fi

  tag:
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag release
        id: tag
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${BRANCH#release/}"
          git tag -m "v${VERSION}" "v${VERSION}"
          git push origin "v${VERSION}"
          git push origin --delete "$BRANCH" || true
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [tag]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: v${{ needs.tag.outputs.version }}

      - name: Extract release notes
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          awk "/^## ${VERSION}/{found=1; next} /^## /{found=0} found" CHANGELOG.md > "${{ runner.temp }}/release-notes.md"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
